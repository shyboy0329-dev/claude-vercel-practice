<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code 배포 실습</title>
  <style>
    /* 페이지 전체 기본 설정 */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: "Malgun Gothic", sans-serif;
      background-color: #f5f5f5;
      color: #222222;
    }

    /* 큰 제목 */
    h1 {
      font-size: 48px;
      margin: 0 0 20px 0;
    }

    /* 제목 아래 흐름 표시 */
    .flow {
      font-size: 18px;
      color: #555555;
      margin: 0 0 20px 0;
    }

    /* 설명 문구 */
    p {
      font-size: 20px;
      margin: 0 0 40px 0;
    }

    /* 버전 표시 */
    .version {
      font-size: 16px;
      color: #777777;
      border: 1px solid #cccccc;
      border-radius: 20px;
      padding: 8px 20px;
    }
  </style>
</head>
<body>

  <h1>Claude Code 배포 실습</h1>

  <div class="flow">Claude Code → Git → GitHub → Vercel</div>

  <p>GitHub Push를 통한 자동 배포에 성공했습니다.</p>

  <div class="version">Version 2</div>

</body>
</html>
